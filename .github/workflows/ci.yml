name: Linux CI and Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked
      - run: cargo +stable build --release --locked

  build-release:
    needs: check
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            emulator: ''
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            emulator: qemu-aarch64
          - arch: armv7
            target: armv7-unknown-linux-musleabihf
            emulator: qemu-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install ARM emulator
        if: matrix.emulator != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
      - name: Build and smoke-test release binary
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ARCH: ${{ matrix.arch }}
          RUST_TARGET: ${{ matrix.target }}
          EMULATOR: ${{ matrix.emulator }}
        run: |
          version="$(cargo +stable metadata --locked --no-deps --format-version 1 |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            printf 'Release tag %s must match Cargo.toml version v%s.\n' "$RELEASE_TAG" "$version" >&2
            exit 1
          fi

          rustup toolchain install stable --profile minimal --target "$RUST_TARGET"
          cargo +stable build --release --locked --target "$RUST_TARGET" \
            --config "target.$RUST_TARGET.linker=\"rust-lld\""
          binary="target/$RUST_TARGET/release/serial-tui"
          runner=()
          if [[ -n "$EMULATOR" ]]; then
            runner+=("$EMULATOR")
          fi
          test "$("${runner[@]}" "$binary" --version)" = "serial-tui $version"
          install -D -m 755 "$binary" "target/release-assets/serial-tui-linux-$RELEASE_ARCH"
      - name: Store release binary
        uses: actions/upload-artifact@v7
        with:
          path: target/release-assets/serial-tui-linux-${{ matrix.arch }}
          archive: false
          if-no-files-found: error

  release:
    needs: build-release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: serial-tui-linux-*
          merge-multiple: true
          digest-mismatch: error
          path: release-assets
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: release-assets
        run: |
          binaries=(serial-tui-linux-x86_64 serial-tui-linux-aarch64 serial-tui-linux-armv7)
          for binary in "${binaries[@]}"; do
            test -s "$binary"
          done
          draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft || true)"
          if [[ "$draft" == false ]]; then
            printf 'Release %s is already published.\n' "$RELEASE_TAG"
            exit 0
          fi
          if [[ "$draft" != true ]]; then
            prerelease=()
            if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
              prerelease+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes --draft "${prerelease[@]}"
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${binaries[@]}"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
