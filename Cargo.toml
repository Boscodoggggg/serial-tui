[package]
name = "serial-tui"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Keyboard-first serial workbench for Linux terminals"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.8.1", default-features = false, features = ["serde"] }
tempfile = "3"
unicode-width = "0.2"
